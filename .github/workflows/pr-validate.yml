name: PR validate

on:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node_modules/.bin/tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --strict --esModuleInterop --skipLibCheck --types node tests/handlers/shared.test.ts tests/handlers/pre-tool-use.test.ts tests/handlers/post-tool-use.test.ts tests/handlers/permission.test.ts
      - run: npm run build
      - run: npm run smoke:import && npm run smoke:version
      - run: npm run smoke:model
      - run: npm run smoke:guard
